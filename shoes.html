<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCollections - Shoes</title>
    <style>
        :root { --bg-color: #0f0f0f; --card-bg: #181818; --border-color: #2a2a2a; --text-main: #f3f4f6; --text-muted: #9ca3af; --accent: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 30px auto; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .nav-link { background: #222; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; transition: background 0.2s; }
        .nav-link:hover { background: #333; }
        h1 { font-size: 1.8rem; font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .img-container { width: 100%; height: 320px; position: relative; background: #121212; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; transition: opacity 0.3s ease-in-out; }
        .img-container img.hover-img { opacity: 0; }
        .img-container:hover img.front-img { opacity: 0; }
        .img-container:hover img.hover-img { opacity: 1; }
        .card-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .prod-name { font-size: 1rem; font-weight: 600; color: var(--text-main); }
        .prod-price { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
        .prod-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; flex-grow: 1; }
        .no-products { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="nav-link">← Home</a>
        <h1>Shoes</h1>
    </div>
    <div class="grid" id="productGrid">
        <div class="no-products">Loading shoes...</div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyBnbwhqab084EE05kf5ApIbvJ-q8odHb4g", authDomain: "joshuahere-e6be0.firebaseapp.com", projectId: "joshuahere-e6be0", storageBucket: "joshuahere-e6be0.appspot.com", messagingSenderId: "293721153527", appId: "1:293721153527:web:baf3ba82a3314cdf2bd8f2" }));
        async function loadProducts() {
            const grid = document.getElementById('productGrid');
            try {
                const q = query(collection(db, "tcollections_products"), where("category", "==", "Shoes"));
                const querySnapshot = await getDocs(q);
                grid.innerHTML = '';
                if (querySnapshot.empty) {
                    grid.innerHTML = '<div class="no-products">No shoes found in inventory yet.</div>';
                    return;
                }
                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="img-container">
                            <img src="${product.frontPic}" alt="${product.name}" class="front-img">
                            <img src="${product.hoverPic || product.frontPic}" alt="${product.name} hover" class="hover-img">
                        </div>
                        <div class="card-body">
                            <div class="prod-name">${escapeHtml(product.name)}</div>
                            <div class="prod-price">ZMW ${parseFloat(product.price).toFixed(2)}</div>
                            <div class="prod-desc">${escapeHtml(product.description || '')}</div>
                        </div>`;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = '<div class="no-products">Failed to load products.</div>';
            }
        }
        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
        loadProducts();
    </script>
</body>
</html>
