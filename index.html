<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCOLLECTIONS - Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #fff; color: #111; min-height: 100vh; display: flex; flex-direction: column; opacity: 0; animation: fadeIn 0.5s ease forwards; overflow-x: hidden; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .announcement { background: #f7f7f7; font-size: 0.75rem; text-align: center; padding: 8px 15px; font-weight: 500; }
        
        header { border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); z-index: 100; }
        .nav-container { max-width: 1440px; margin: 0 auto; padding: 0 15px; display: flex; flex-direction: column; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
        
        @media(min-width: 768px) {
            .nav-container { flex-direction: row; align-items: center; justify-content: space-between; padding: 0 30px; height: 70px; gap: 20px; }
        }
        @media(min-width: 1024px) {
            .nav-container { padding: 0 40px; }
        }

        .logo { font-size: 1.25rem; font-weight: 900; color: #000; text-decoration: none; letter-spacing: -1px; white-space: nowrap; }
        @media(min-width: 768px) { .logo { font-size: 1.4rem; } }

        /* Responsive Scrollable Category Nav for Mobile */
        .nav-links-wrapper { width: 100%; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .nav-links-wrapper::-webkit-scrollbar { display: none; }
        
        .nav-links { display: inline-flex; gap: 20px; list-style: none; padding-bottom: 4px; }
        @media(min-width: 768px) {
            .nav-links-wrapper { width: auto; overflow-x: visible; white-space: normal; }
            .nav-links { display: flex; gap: 25px; padding-bottom: 0; }
        }

        .nav-links a { text-decoration: none; color: #111; font-weight: 600; font-size: 0.85rem; border-bottom: 2px solid transparent; padding-bottom: 4px; transition: border-color 0.2s; }
        @media(min-width: 768px) { .nav-links a { font-size: 0.9rem; } }
        .nav-links a:hover { border-color: #000; }

        .search-input { padding: 9px 16px; border-radius: 20px; border: 1px solid #e5e5e5; background: #f5f5f5; font-size: 0.85rem; outline: none; width: 100%; transition: all 0.2s; }
        @media(min-width: 768px) {
            .search-input { width: 200px; }
            .search-input:focus { width: 240px; border-color: #000; background: #fff; }
        }

        main { max-width: 1440px; margin: 0 auto; padding: 20px 15px; flex: 1; width: 100%; }
        @media(min-width: 768px) { main { padding: 30px; } }
        @media(min-width: 1024px) { main { padding: 40px; } }

        .hero { background: #000; color: #fff; padding: 45px 20px; text-align: center; border-radius: 8px; margin-bottom: 30px; }
        @media(min-width: 768px) { .hero { padding: 70px 30px; margin-bottom: 40px; } }
        
        .hero h1 { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; letter-spacing: -0.5px; }
        @media(min-width: 768px) { .hero h1 { font-size: 2.8rem; letter-spacing: -1px; } }
        
        .hero p { color: #a3a3a3; font-size: 0.85rem; max-width: 600px; margin: 0 auto; line-height: 1.4; }
        @media(min-width: 768px) { .hero p { font-size: 0.95rem; } }

        .section-title { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; letter-spacing: -0.5px; }
        @media(min-width: 768px) { .section-title { font-size: 1.8rem; margin-bottom: 25px; } }

        /* Flexible Grid adapting to screen size */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media(min-width: 540px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; } }
        @media(min-width: 1024px) { .product-grid { gap: 30px; } }

        .product-card { background: #fff; display: flex; flex-direction: column; transition: transform 0.2s ease; }
        @media(hover: hover) {
            .product-card:hover { transform: translateY(-3px); }
        }

        .image-container { position: relative; width: 100%; padding-top: 100%; background: #f4f4f4; border-radius: 4px; overflow: hidden; }
        .image-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s ease; }
        .image-container img.hover-img { opacity: 0; }
        
        /* Only apply hover swap on devices supporting hover pointers */
        @media(hover: hover) {
            .product-card:hover .image-container img.front-img { opacity: 0; }
            .product-card:hover .image-container img.hover-img { opacity: 1; }
        }

        .product-info { padding: 12px 0; display: flex; flex-direction: column; gap: 4px; }
        @media(min-width: 768px) { .product-info { padding: 15px 0; gap: 5px; } }

        .cat-tag { font-size: 0.7rem; color: #757575; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; transition: color 0.2s; }
        @media(min-width: 768px) { .cat-tag { font-size: 0.75rem; } }
        .cat-tag:hover { color: #000; }

        .prod-name { font-size: 0.9rem; font-weight: 600; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media(min-width: 768px) { .prod-name { font-size: 1rem; } }

        .prod-price { font-size: 0.85rem; font-weight: 700; color: #000; }
        @media(min-width: 768px) { .prod-price { font-size: 0.95rem; } }

        .whatsapp-btn { margin-top: 6px; background: #000; color: #fff; border: none; padding: 9px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border-radius: 4px; text-align: center; text-decoration: none; transition: background 0.2s; }
        @media(min-width: 768px) { .whatsapp-btn { padding: 10px; font-size: 0.8rem; margin-top: 8px; } }
        .whatsapp-btn:hover { background: #333; }

        footer { border-top: 1px solid #e5e5e5; padding: 30px 15px; background: #fafafa; margin-top: auto; }
        @media(min-width: 768px) { footer { padding: 40px; } }

        .footer-content { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .login-link { font-size: 0.85rem; color: #111; text-decoration: underline; font-weight: 600; width: fit-content; }
        .copy { font-size: 0.75rem; color: #757575; }
        .empty { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: #757575; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="announcement"></div>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">TCOLLECTIONS</a>
            <div class="nav-links-wrapper">
                <ul class="nav-links">
                    <li><a href="shoes.html">Shoes</a></li>
                    <li><a href="hoodies.html">Hoodies</a></li>
                    <li><a href="tshirts.html">T-Shirts</a></li>
                    <li><a href="shorts.html">Shorts</a></li>
                    <li><a href="bottoms.html">Bottoms</a></li>
                    <li><a href="tracksuits.html">Tracksuits</a></li>
                </ul>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="Search item names...">
        </div>
    </header>
    <main>
        <div class="hero">
            <h1>ENGINEERED FOR THE STREETS</h1>
            <p>Discover the latest drops synced directly to the TCOLLECTIONS cloud ecosystem.</p>
        </div>
        <div class="section-title">Latest Drops</div>
        <div class="product-grid" id="productGrid">
            <div class="empty">Loading products from database...</div>
        </div>
    </main>
    <footer>
        <div class="footer-content">
            <a href="add.html" class="login-link">Login</a>
            <span class="copy">© 2026 TCOLLECTIONS Inc. All Rights Reserved.</span>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyBnbwhqab084EE05kf5ApIbvJ-q8odHb4g", authDomain: "joshuahere-e6be0.firebaseapp.com", projectId: "joshuahere-e6be0", storageBucket: "joshuahere-e6be0.firebasestorage.app", messagingSenderId: "293721153527", appId: "1:293721153527:web:baf3ba82a3314cdf2bd8f2" }));
        
        let allProducts = [];
        const grid = document.getElementById('productGrid');
        const search = document.getElementById('searchInput');

        async function loadProducts() {
            try {
                const snap = await getDocs(collection(db, "tcollections_products"));
                allProducts = [];
                snap.forEach(d => allProducts.push(d.data()));
                allProducts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                displayProducts(allProducts);
            } catch(e) { 
                grid.innerHTML = `<div class="empty">Database connection error.</div>`; 
            }
        }

        function displayProducts(list) {
            if(!list.length) { 
                grid.innerHTML = `<div class="empty">No items found matching your criteria.</div>`; 
                return; 
            }
            grid.innerHTML = "";
            list.forEach(p => {
                const wa = `https://wa.me/260979342993?text=` + encodeURIComponent(`Hello TCOLLECTIONS, I would like to buy ${p.name} for ZMW ${Number(p.price).toLocaleString()}. Please let me know availability!`);
                
                const catPageMap = {
                    'Shoes': 'shoes.html',
                    'Hoodies': 'hoodies.html',
                    'Tshirts': 'tshirts.html',
                    'Shorts': 'shorts.html',
                    'Bottoms': 'bottoms.html',
                    'Tracksuits': 'tracksuits.html'
                };
                const targetPage = catPageMap[p.category] || 'index.html';

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="image-container">
                            <img src="${p.frontPic}" class="front-img">
                            <img src="${p.hoverPic}" class="hover-img">
                        </div>
                        <div class="product-info">
                            <a href="${targetPage}" class="cat-tag">${p.category} ↗</a>
                            <span class="prod-name">${p.name}</span>
                            <span class="prod-price">ZMW ${Number(p.price).toLocaleString()}</span>
                            <a href="${wa}" target="_blank" class="whatsapp-btn">Purchase</a>
                        </div>
                    </div>`;
            });
        }

        search.addEventListener('input', () => {
            const q = search.value.toLowerCase().trim();
            if(q) {
                const res = allProducts.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
                displayProducts(res);
            } else {
                displayProducts(allProducts);
            }
        });

        loadProducts();
    </script>
</body>
</html>
